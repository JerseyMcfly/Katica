<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katica – Értesítések engedélyezése</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "3f6344dd-01bd-4530-a847-9531c43d24ee"
      });
    });
  </script>

  <style>
    :root { --primary: #e53e3e; --primary-hover: #c53030; --bg: #fdfbf7; --text: #2d3748; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card {
      background: #ffffff; border-radius: 20px; padding: 28px; max-width: 420px; width: 100%;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); border: 1px solid #edf2f7; text-align: center;
    }
    h1 { font-size: 1.3rem; color: var(--primary); margin-bottom: 12px; }
    p { font-size: 0.95rem; color: #4a5568; margin-bottom: 16px; line-height: 1.5; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 12px; background-color: var(--primary);
      color: white; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    button:hover:not(:disabled) { background-color: var(--primary-hover); }
    button:disabled { background-color: #cbd5e0; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 0.9rem; font-weight: 600; min-height: 1.2em; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐞 Katica csoport házipénztár</h1>
    <p>Engedélyezd az értesítéseket, hogy megkapd a gyümölcsnapi és a programemlékeztetőket ezen a telefonon/gépen.</p>
    <button id="enable-btn">Értesítések engedélyezése</button>
    <p id="status"></p>
  </div>

  <script>
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const email = getParam('email');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('enable-btn');

    if (!email) {
      statusEl.innerText = 'Hiányzik az e-mail cím a linkből. Nyisd meg ezt az oldalt a Katica házipénztár alkalmazásból, az "Értesítések engedélyezése" gombra kattintva.';
      btn.disabled = true;
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      statusEl.innerText = 'Feldolgozás...';

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();

          if (OneSignal.Notifications.permission) {
            await OneSignal.login(email.trim().toLowerCase());
            statusEl.innerText = '✅ Sikeres! Mostantól kapod az értesítéseket ezen az eszközön. Ezt az oldalt bezárhatod.';
          } else {
            statusEl.innerText = 'Az értesítés engedélyezése elutasítva. Ha meggondolod magad, engedélyezd a böngésződ oldal-beállításaiban, majd töltsd újra ezt az oldalt.';
            btn.disabled = false;
          }
        } catch (err) {
          console.error(err);
          statusEl.innerText = 'Hiba történt: ' + (err && err.message ? err.message : 'ismeretlen hiba') + '. Próbáld újra.';
          btn.disabled = false;
        }
      });
    });
  </script>

</body>
</html>
